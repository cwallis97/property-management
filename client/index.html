<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Sets data-theme on <html> synchronously, before React (or any CSS
      that will eventually react to it) ever paints — the standard
      flash-of-wrong-theme fix. ThemeProvider (src/context/ThemeContext.jsx)
      keeps this in sync afterward for every subsequent preference change;
      this script only owns the very first paint. No CSS currently reads
      data-theme at all (that's the next milestone's actual dark styling),
      so today this is inert groundwork, not a visible behavior change.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("propertyos.theme");
          var theme = stored === "light" || stored === "dark" ? stored : null;
          if (!theme) {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.dataset.theme = theme;
        } catch (e) {}
      })();
    </script>
    <title>PropertyOS</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
